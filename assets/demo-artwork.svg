<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="60%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>

    <!-- Vibrant primary chromatic gradient -->
    <linearGradient id="chromaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="35%" stop-color="#ff0078"/>
      <stop offset="70%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Secondary glowing gradient -->
    <linearGradient id="chromaGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#3366ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>

    <!-- Golden sun light gradient for contrast testing -->
    <radialGradient id="lightSun" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffea75"/>
      <stop offset="70%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern for scale/zoom testing -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(255, 255, 255, 0.2)"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)"/>
  <rect width="1000" height="1000" fill="url(#techGrid)"/>

  <!-- Asymmetric geometric background waves -->
  <path d="M -100 300 Q 250 100 500 400 T 1100 300 L 1100 1100 L -100 1100 Z" fill="url(#chromaGrad1)" opacity="0.25"/>
  <path d="M 1100 200 Q 750 600 400 300 T -100 700 L -100 -100 L 1100 -100 Z" fill="url(#chromaGrad2)" opacity="0.2"/>

  <!-- Outer frame accent lines -->
  <circle cx="500" cy="500" r="420" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="500" cy="500" r="380" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>

  <!-- High contrast light sphere (Top-Left quadrant - key for light & rotation/flip orientation) -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="140" fill="url(#lightSun)" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="70" fill="#ffffff"/>
  </g>

  <!-- Dark shadow crescent (Bottom-Right quadrant - for light contrast) -->
  <g transform="translate(700, 700)">
    <path d="M -120 -120 A 160 160 0 1 0 120 120 A 120 120 0 1 1 -120 -120 Z" fill="#040508" opacity="0.9"/>
    <circle cx="-20" cy="-20" r="90" fill="none" stroke="#ff0078" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Central Asymmetric Dynamic Composition -->
  <g transform="translate(500, 500)">
    <!-- Rotating prism arms -->
    <path d="M 0 0 L 220 -80 L 160 140 Z" fill="url(#chromaGrad1)" filter="url(#neonGlow)"/>
    <path d="M 0 0 L -180 160 L -120 -200 Z" fill="url(#chromaGrad2)"/>
    <path d="M 0 0 L -160 -120 L 140 -180 Z" fill="#ffffff" opacity="0.85"/>

    <!-- Concentric central rings -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00f0ff" stroke-width="4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ff0078" stroke-width="3" stroke-dasharray="14 10"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff"/>

    <!-- Directional arrow-like asymmetric marker (Top-Right pointing) for unambiguous orientation -->
    <polygon points="180,-180 240,-240 250,-190 220,-170" fill="#00ffcc" filter="url(#neonGlow)"/>
    <text x="210" y="-220" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff" opacity="0.9">ATELIÊ</text>
  </g>

  <!-- Detail grid lines and crosshairs for zoom & alignment testing -->
  <line x1="100" y1="500" x2="900" y2="500" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="500" y1="100" x2="500" y2="900" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Corner asymmetric indicators (TL, TR, BL, BR) -->
  <rect x="60" y="60" width="80" height="20" fill="#ff3b00" rx="4"/>
  <circle cx="920" cy="80" r="25" fill="#00f0ff"/>
  <polygon points="70,930 110,870 130,940" fill="#9d00ff"/>
  <rect x="880" y="880" width="60" height="60" fill="none" stroke="#00ffcc" stroke-width="4" rx="12"/>
</svg>
