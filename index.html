<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ateliê — Experimento prático de inferência de interface intuitiva para IHC/UX em editor de imagens.">
  <title>Ateliê - Laboratório Visual</title>

  <!-- Favicon e Estilos Locais -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Glow Layers -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <!-- App Structure Container -->
  <main class="atelie-container">

    <!-- Header: Minimalist Invitation -->
    <header class="atelie-header">
      <span class="discreet-invitation" id="invitationText">Ateliê</span>
      <div class="header-actions">
        <button class="upload-button" id="uploadButton" type="button" aria-label="Carregar uma imagem do computador">
          <img class="pointer-icon" src="assets/pointer-icon.png" alt="" aria-hidden="true">
        </button>
        <div class="status-indicator" title="Ateliê Ativo"></div>
      </div>
    </header>

    <!-- Cluster Esquerdo de Controles (Luminosidade, Cor & Restauração) -->
    <aside class="control-cluster cluster-left">
      
      <!-- Controle 1: Luminosidade (Arco de Luz Incompleto) -->
      <div class="abstract-control ctrl-luminosity" 
           id="ctrlLuminosity" 
           role="slider" 
           aria-label="Ajustar luminosidade e iluminação da imagem"
           aria-valuemin="20" 
           aria-valuemax="200" 
           aria-valuenow="100" 
           tabindex="0">
        <svg class="luminosity-svg" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="lum-track" cx="50" cy="50" r="38" />
          <circle class="lum-glow-arc" id="lumGlowArc" cx="50" cy="50" r="38" />
        </svg>
        <svg class="lucide-icon lantern-icon" viewBox="0 0 24 24" aria-hidden="true" data-lucide="lamp"></svg>
        <div class="lum-handle" id="lumHandle" style="transform: translate(0px, -38px);"></div>
      </div>

      <!-- Controle 2: Cor / Saturação (Mancha Cromática Fluida Vetorial) -->
      <div class="abstract-control ctrl-chroma" 
           id="ctrlChroma" 
           role="slider" 
           aria-label="Ajustar intensidade de cor e saturação"
           aria-valuemin="0" 
           aria-valuemax="250" 
           aria-valuenow="100" 
           tabindex="0">
        <svg class="chroma-svg" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff0078" />
              <stop offset="35%" stop-color="#9d00ff" />
              <stop offset="70%" stop-color="#00f0ff" />
              <stop offset="100%" stop-color="#00ff9d" />
            </linearGradient>
            <filter id="blobGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
          <!-- Gota/Mancha Cromática Orgânica -->
          <path class="chroma-blob-path" id="chromaBlobPath" 
                d="M 50 14 C 74 14 86 30 86 50 C 86 70 68 86 50 86 C 32 86 14 72 14 50 C 14 30 28 14 50 14 Z" 
                fill="url(#blobGrad)" 
                filter="url(#blobGlow)" />
          <!-- Brilho de Reflexo Interno -->
          <ellipse cx="38" cy="32" rx="12" ry="7" fill="rgba(255,255,255,0.4)" transform="rotate(-25 38 32)" />
        </svg>
      </div>

      <!-- Controle 6: Restauração (Aviso de Perigo) -->
      <button class="abstract-control ctrl-reset" 
              id="ctrlReset" 
              aria-label="Restaurar estado inicial e desfazer todas as edições" 
              type="button">
        <img class="reset-img" src="assets/redo.png" alt="" aria-hidden="true">
      </button>

    </aside>

    <!-- Viewport Central: Moldura da Imagem -->
    <section class="viewport-container">
      <div class="image-frame" id="imageFrame" tabindex="0" aria-label="Área de exibição da imagem. Clique para selecionar a área de zoom, arraste para explorar ou dê duplo clique para carregar nova imagem.">
        <canvas id="mainCanvas"></canvas>

        <!-- Editor de Texto Inline -->
        <textarea id="textEditor" class="text-editor" spellcheck="false" aria-label="Editar texto inserido na imagem"></textarea>

        <!-- Dynamic Focal Point Indicator for Selective Zoom -->
        <div class="focal-target-ring" id="focalRing" aria-hidden="true"></div>

        <!-- Dynamic Drop Hint Overlay -->
        <div class="drop-hint-overlay" aria-hidden="true">
          <div class="drop-pulse-ring"></div>
        </div>
      </div>

      <!-- Seletor de Arquivos Oculto -->
      <input type="file" id="fileInput" accept="image/*" aria-label="Carregar imagem local">
    </section>

    <!-- Cluster Criativo Inferior (Recorte, Texto e Desenho) -->
    <aside class="control-cluster cluster-creative">

      <!-- Ferramenta 1: Recorte (Espada) -->
      <button class="abstract-control ctrl-crop"
              id="ctrlCrop"
              aria-label="Modo de recorte. Arraste sobre a imagem e pressione Enter para confirmar ou Esc para cancelar"
              aria-pressed="false"
              type="button">
        <img class="tool-svg tool-img" src="assets/corte.png" alt="" aria-hidden="true">
      </button>

      <!-- Download da Imagem Editada (aparece apenas após alguma edição) -->
      <button class="abstract-control ctrl-download-tool is-hidden"
              id="downloadButton"
              aria-label="Baixar a imagem editada"
              type="button">
        <img class="tool-svg tool-img" src="assets/download.png" alt="" aria-hidden="true">
      </button>

      <!-- Ferramenta 2: Inserir Texto (Pilcrow) -->
      <button class="abstract-control ctrl-text-tool"
              id="ctrlText"
              aria-label="Modo de inserir texto. Clique sobre a imagem para adicionar um texto"
              aria-pressed="false"
              type="button">
        <img class="tool-svg tool-img" src="assets/escrever.png" alt="" aria-hidden="true">
      </button>

      <!-- Ferramenta 3: Desenhar (Pena) -->
      <button class="abstract-control ctrl-draw"
              id="ctrlDraw"
              aria-label="Modo de desenhar. Arraste sobre a imagem para desenhar com a pena"
              aria-pressed="false"
              type="button">
        <img class="tool-svg tool-img" src="assets/desenhar.png" alt="" aria-hidden="true">
      </button>

    </aside>

    <!-- Cluster Direito de Controles (Espaciais: Rotação, Zoom, Espelhamento) -->
    <aside class="control-cluster cluster-right">

      <!-- Controle 3: Rotação (Peça Geométrica Assimétrica) -->
      <button class="abstract-control ctrl-rotation" 
              id="ctrlRotation" 
              aria-label="Girar imagem 90 graus no sentido horário" 
              type="button">
        <img class="rotation-img" src="assets/rotate-icon.jpg" alt="Girar imagem 90 graus no sentido horário" aria-hidden="true">
      </button>

      <!-- Controle 4: Aproximação / Zoom -->
      <div class="abstract-control ctrl-zoom" 
           id="ctrlZoom" 
           role="slider" 
           aria-label="Ajustar nível de aproximação e zoom"
           aria-valuemin="50" 
           aria-valuemax="250" 
           aria-valuenow="100" 
           tabindex="0">
        <img class="zoom-img" src="assets/zoom.jpg" alt="" aria-hidden="true">
      </div>

      <!-- Controle 5: Espelhamento (Metades Simétricas Refletidas) -->
      <button class="abstract-control ctrl-reflect" 
              id="ctrlReflect" 
              aria-label="Espelhar imagem horizontalmente" 
              type="button">
        <img class="reflect-img" src="assets/espelho.jpg" alt="" aria-hidden="true">
      </button>

    </aside>

  </main>

  <!-- Lógica da Aplicação -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
  <script src="js/app.js"></script>
</body>
</html>
